name: Release CLI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Cross-Platform CLI Binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/primitive-windows-amd64.exe ./cmd/primitive
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/primitive-windows-arm64.exe ./cmd/primitive
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/primitive-linux-amd64 ./cmd/primitive
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/primitive-linux-arm64 ./cmd/primitive
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/primitive-darwin-amd64 ./cmd/primitive
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/primitive-darwin-arm64 ./cmd/primitive

      - name: Package Archives
        run: |
          cd dist
          zip primitive-windows-amd64.zip primitive-windows-amd64.exe ../LICENSE.md ../README.md
          zip primitive-windows-arm64.zip primitive-windows-arm64.exe ../LICENSE.md ../README.md
          tar -czf primitive-linux-amd64.tar.gz primitive-linux-amd64 ../LICENSE.md ../README.md
          tar -czf primitive-linux-arm64.tar.gz primitive-linux-arm64 ../LICENSE.md ../README.md
          tar -czf primitive-darwin-amd64.tar.gz primitive-darwin-amd64 ../LICENSE.md ../README.md
          tar -czf primitive-darwin-arm64.tar.gz primitive-darwin-arm64 ../LICENSE.md ../README.md
          cd ..

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Primitive ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            echo "title=Primitive v1.0.0 (CLI Release)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: |
            dist/primitive-windows-amd64.exe
            dist/primitive-windows-amd64.zip
            dist/primitive-windows-arm64.zip
            dist/primitive-linux-amd64.tar.gz
            dist/primitive-linux-arm64.tar.gz
            dist/primitive-darwin-amd64.tar.gz
            dist/primitive-darwin-arm64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
